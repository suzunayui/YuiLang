[package]
name = "yuilang"
version = "0.2.0"
edition = "2021"
description = "YuiLang: a programming language designed for AI-driven development"
license = "MIT"
repository = "https://github.com/suzunayui/YuiLang"

[lib]
name = "yuilang"
path = "src/lib.rs"

[[bin]]
name = "yui"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
