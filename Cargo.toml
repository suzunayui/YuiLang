[package]
name = "yuilang"
version = "2026.1125.1"
edition = "2021"
description = "YuiLang: a programming language designed for AI-driven development"
license = "MIT"
repository = "https://github.com/suzunayui/YuiLang"

[lib]
name = "yuilang"
path = "src/lib.rs"

[[bin]]
name = "yui"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# An internal error ends the process at once instead of unwinding. This drops
# the unwinding tables, about a third of the executable, at no cost in speed.
panic = "abort"
